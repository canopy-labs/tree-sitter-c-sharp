# Build the Python wheels the Featureflip flag-cleanup Action installs.
#
# WHY THIS FORK HAS ITS OWN WHEEL PIPELINE
# ----------------------------------------
# This branch is upstream 0.24.0 plus the grammar and scanner patches
# polyglot-piranha carries that upstream has not merged, and it is cut from the
# SAME commit the engine pins so the two cannot drift. Upstream merged most of
# what +canopy.1..4 carried (the escaped-brace hole, `""` after a hole, `#if`
# blocks in initializers and around `else` / method bodies, and more); what is
# still ours:
#
#   - `partial`, `async` and `required` read as identifiers at statement start.
#   - `partial` after `ref` (`ref partial struct`) stays a `modifier` node.
#   - `/*` on a #region/#pragma/#error/#warning line is directive text;
#     directive text ends at every C# line break; and inside an `#if` block a
#     comment or verbatim/raw/interpolated string that holds an
#     `#else`/`#elif`/`#endif` it did not open (or leaves an `#if` open) is an
#     ERROR, so a file whose skipped-branch boundaries the grammar cannot see is
#     refused instead of silently mis-parsed.
#   - an `#if` block holds several attribute lists.
#
# The Action re-parses every rewrite with the `tree-sitter-c-sharp` PyPI
# package as a safety gate. If that gate keeps the stock grammar while the
# engine has the patched one, the two disagree about what the code means, and
# the gate judges a rewrite against a tree the engine never saw. So the gate
# needs THIS grammar, as a wheel, and PyPI has no such build.
#
# The version carries a PEP 440 local segment (`0.24.0+canopy.1`). That is what
# makes the Action's pin unambiguous: PyPI forbids local versions, so
# `==0.24.0+canopy.1` can only ever be satisfied by a wheel from this release
# and never silently by upstream's identically-numbered 0.24.0. Bump the local
# segment whenever the engine's pinned commit moves -- the grammar version
# itself stays 0.24.0, so it is the only thing that can distinguish the builds.
name: Canopy wheels

on:
  push:
    tags: ['v*-canopy.*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both arches -- no QEMU. The arm64 runner is
          # free on public repositories, which this fork is.
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2
        env:
          # `build = "cp39-*"` in pyproject.toml plus setup.py's BdistWheel tag
          # override means ONE abi3 wheel per arch, tagged `cp310-abi3` (the
          # override's floor, as upstream's own PyPI wheels are) and
          # installable on 3.10+. The Action runs 3.12.
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # manylinux only. The Action's image is python:3.12-slim (glibc), and
          # a musllinux build would double the matrix for a wheel nothing installs.
          CIBW_SKIP: '*-musllinux_*'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  release:
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Tags only. A `workflow_dispatch` run is for checking the build still
    # works, and `GITHUB_REF_NAME` is then the BRANCH -- so without this the
    # dispatch would try to cut a release named after it.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Show what will be published
        run: ls -la dist

      # Both arches or nothing: `needs` already gates this on the whole matrix,
      # so a partial release cannot be produced by one arch failing.
      - name: Publish the wheels on this tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Upstream 0.24.0 plus the scanner and grammar patches polyglot-piranha pins that upstream has not merged (contextual keywords as identifiers, ref partial modifiers, directive text, skipped-branch boundaries judged by #if depth, attribute lists in #if) -- built as abi3 manylinux wheels for the Featureflip flag-cleanup Action. Not a PyPI release: the version carries a PEP 440 local segment so it can only be installed by exact pin."
